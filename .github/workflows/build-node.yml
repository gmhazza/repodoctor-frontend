name: Build Vue.js Project

on:
  push:
    branches: [ "main" ] # Change to your default branch if different (e.g., "master")
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # Test across multiple Node versions, or pick a single one like [20.x]

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Automatically caches npm dependencies to speed up builds

      # 3. Install project dependencies
      # Use 'ci' for clean installs based on your lock file, fallback to 'install' if needed
      - name: Install Dependencies
        run: npm ci

      # 4. Build the Vue application
      - name: Build Project
        run: npm run build
