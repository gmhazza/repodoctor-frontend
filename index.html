<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090a0d">
    <meta name="author" content="Repo Doctor">
    <meta name="description" content="Review public GitHub repositories, find important issues, and get practical fixes with Repo Doctor.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Repo Doctor · Find issues before your users do">
    <meta property="og:description" content="Review public GitHub repositories, find important issues, and get practical fixes with Repo Doctor.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Repo Doctor">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Repo Doctor · Find issues before your users do">
    <meta name="twitter:description" content="Review public GitHub repositories, find important issues, and get practical fixes with Repo Doctor.">
    <script id="repo-doctor-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Repo Doctor",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "A repository review tool that surfaces important code issues and suggested fixes."
      }
    </script>
    <title>Repo Doctor · Find issues before your users do</title>
    <script>
      try {
        const theme = localStorage.getItem('repo-doctor-theme') || 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
